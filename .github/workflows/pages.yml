# Ultima IV Web Korean -- GitHub Pages release workflow (Todo 19).
#
# Target repository (HTTPS): https://github.com/TaejinKim7-dev/ultima
# SSH write remote:          git@github.com:TaejinKim7-dev/ultima.git
# Expected Pages URL:        https://taejinkim7-dev.github.io/ultima/
#
# One-time setup (do this before pushing commits that should deploy):
#   1. Repository Settings > Pages > Build and deployment > Source:
#      select "GitHub Actions" (not a branch). Without this, the `deploy`
#      job below will fail even though `build` succeeds.
#   2. Before pushing to the SSH remote above, verify SSH auth with a
#      non-mutating command, e.g. `ssh -T git@github.com`. A successful
#      response prints a "Hi <user>! You've successfully authenticated"
#      greeting even though the command's own exit status is 1 -- that is
#      expected and is not a failure.
#   3. Pushing (or merging a PR) to `main` triggers `build` + `deploy`;
#      pushes/PRs against other branches only trigger `build`.
#
# Note: this workflow's own jobs never push over git. GitHub Pages
# deployment below uses the official, OIDC-based Pages Actions
# (`id-token: write` + `actions/deploy-pages`) through the Pages REST API,
# not a git-level push -- so there is no in-CI step that could need the SSH
# credential above. That check is guidance for whoever pushes commits to
# this repository, not something this workflow runs itself.
#
# Engine build (Todo 19, 2026-09-27): the Pages artifact must ship the
# real xu4 engine -- vite.config.ts copies build/wasm-release/{xu4.mjs,
# xu4.wasm,modules/*} into dist/engine/ only when that build exists and
# otherwise silently emits a shell nobody can play. So this job builds
# host Boron/Faun (`deps:host`, needs the apt audio headers below), the
# xu4 modules (`build:modules`), wasm Boron (`deps:wasm`) and the engine
# (`build:wasm`) with the pinned emsdk before `build:site`, and
# `audit:dist -- --require-engine` fails the job if any engine file is
# missing. The modules are built from pinned xu4 sources; the user's
# own original game data archive is never part of this build or artifact.
# Every step hard-gates `deploy` (no continue-on-error).

name: Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.3"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify pinned vendor sources
        run: npm run verify:repo-sources

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (all but the wasm engine suite, which runs after the engine build)
        run: npx vitest run --passWithNoTests=false --exclude tests/unit/wasm-symbols.test.ts

      - name: Set up Emscripten SDK (pinned to emsdk 4.0.23, see docs/SOURCE_PINS.md)
        # Pinned to emsdk 4.0.23 to match the toolchain snapshot recorded in
        # docs/SOURCE_PINS.md; the action itself follows the repo SHA-pin
        # convention below (commit SHA for v16).
        uses: emscripten-core/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 # v16
        with:
          version: '4.0.23'
          emsdk-version: '4.0.23'

      - name: Install host audio headers (Faun, built by deps:host)
        run: sudo apt-get update && sudo apt-get install -y libpulse-dev libvorbis-dev libflac-dev

      - name: Build host Boron and Faun
        run: npm run deps:host

      - name: Build xu4 modules (render.pak, Ultima-IV.mod)
        run: npm run build:modules

      - name: Build wasm Boron
        run: npm run deps:wasm

      - name: Build the wasm engine
        run: npm run build:wasm

      - name: "Unit tests: wasm engine suite (needs the engine built above)"
        run: npx vitest run --passWithNoTests=false tests/unit/wasm-symbols.test.ts

      - name: Build the Pages site (base "/ultima/")
        run: npm run build:site -- --base=/ultima/

      - name: Audit the dist artifact (real engine present, no original data, no dev tooling)
        run: npm run audit:dist -- --require-engine

      - name: Statically validate this workflow file
        run: npm run verify:workflow

      - name: Add .nojekyll (Pages must not run Jekyll over dist/)
        run: touch dist/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
          include-hidden-files: "true"

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    # Scoped to this job (not the whole workflow) so a `build`-only PR run
    # can't cancel or displace a pending `main` deploy in the same group.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
