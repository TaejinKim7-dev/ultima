<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ultima IV 웹 포트</title>
  </head>
  <body>
    <div id="app">
      <!--
        Game viewport: a canvas for the WASM/WebGL2 renderer, plus a DOM
        overlay layer positioned over the same area for short in-game text
        (HP/status/menus), matching the original screen layout. Long
        dialogue is deliberately NOT here -- see the dialogue panel below.

        Todo 12: `#overlay-layer` itself carries no content -- it is only
        the positioning container `src/shell.ts` creates/positions/removes
        per-role child elements inside (`[data-role="status"|"menu"
        |"textview"]`), sized/positioned from the canvas's actual displayed
        box (see `src/overlay/overlay-layout.ts`). Map/runes/avatar sprite
        masks are never covered by these -- they stay in the raster canvas.
      -->
      <div id="game-viewport" class="viewport">
        <canvas id="game-canvas" width="320" height="200" aria-label="Ultima IV 게임 화면"></canvas>
        <div id="overlay-layer" class="overlay-layer" aria-live="polite"></div>
      </div>

      <!--
        Dialogue panel: scrolling HTML panel below the canvas for long
        conversation text (per the confirmed requirement -- long dialogue
        is never overlaid on the game screen).
      -->
      <section id="dialogue-panel" class="dialogue-panel" aria-live="polite">
        <div id="dialogue-history" class="dialogue-history"></div>
        <!--
          Prompt focus marker (Todo 11): shown/focused when a `prompt`
          bridge event arrives, so keyboard focus visibly lands in the
          dialogue panel. It carries no text of its own (nothing to
          escape) and never intercepts real key delivery -- the GLFW input
          port listens on `window` at the capture phase regardless of
          which element has focus (verified in emsdk's library_glfw.js).
        -->
        <div id="dialogue-prompt-marker" class="dialogue-prompt-marker" tabindex="-1" hidden></div>
      </section>

      <!--
        Original game data is never bundled and never uploaded anywhere --
        the user selects their own local ultima4.zip purely through the
        File API. Save export/import are local Blob download/upload only.
      -->
      <section id="data-controls" class="data-controls">
        <div>
          <label for="rom-picker">원본 ultima4.zip 선택 (로컬 파일, 업로드하지 않음)</label>
          <input type="file" id="rom-picker" accept=".zip" />
        </div>
        <div class="save-controls">
          <button id="save-export" type="button">세이브 내보내기</button>
          <label for="save-import">세이브 가져오기</label>
          <input type="file" id="save-import" accept=".json,.sav" />
          <span id="save-status"></span>
        </div>
      </section>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
